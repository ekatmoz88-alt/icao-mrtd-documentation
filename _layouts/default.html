<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ page.title | default: site.title | default: 'ICAO MRTD Personalization Complex' }}</title>
  <style>
    /* Oracle Redwood palette */
    :root {
      --redwood-bg: #FBF9F8;
      --redwood-header: #161513;
      --redwood-card: #FFFFFF;
      --redwood-accent: #C74634;
      --redwood-line: #E5E2DF;
      --redwood-muted: #6b6b6b;
    }
    
    body {
      max-width: 800px;
      margin: 0 auto;
      padding: 20px;
      font-family: system-ui, -apple-system, sans-serif;
      line-height: 1.6;
      background: var(--redwood-bg);
      color: var(--redwood-header);
    }
    
    h1, h2, h3, h4, h5, h6 {
      color: var(--redwood-header);
    }
    
    .mermaid {
      display: block;
      margin: 20px auto;
      max-width: 100%;
    }
    
    /* Redwood-style navigation panel */
    .nav-panel {
      background: var(--redwood-header);
      border: 1px solid var(--redwood-line);
      border-radius: 6px;
      padding: 12px 20px;
      margin-bottom: 24px;
      font-size: 0.875rem;
    }
    
    .nav-panel a {
      color: var(--redwood-card);
      text-decoration: none;
      margin-right: 16px;
    }
    
    .nav-panel a:hover {
      text-decoration: underline;
    }
    
    .nav-panel a {
      color: #FFFFFF;
    }
    
    /* Back to dashboard button */
    .back-to-dashboard {
      display: inline-block;
      padding: 8px 16px;
      background: var(--redwood-accent);
      color: #FFFFFF;
      border-radius: 6px;
      font-size: 14px;
      text-decoration: none;
      margin-bottom: 24px;
      font-weight: 500;
    }
    
    .back-to-dashboard:hover {
      background: #A83526;
      color: #FFFFFF;
    }
  </style>
</head>
<body>
  <!-- Back to dashboard button -->
  <a href="https://vercel.app" class="back-to-dashboard">← Back to Dashboard</a>
  
  <!-- Navigation panel -->
  <div class="nav-panel">
    <a href="./">Главная ↗</a>
    <a href="SPECIFICATION.html">SPECIFICATION ↗</a>
    <a href="ARCHITECTURE_DIAGRAMS.html">Диаграммы ↗</a>
  </div>
  
  <div class="content">
    {{ content }}
  </div>
  
  <!-- Mermaid.js v10 -->
  <script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      // Find all code blocks - updated selectors for Jekyll/Rouge wrapping
      // Jekyll wraps: <div class="language-mermaid highlighter-rouge"><div class="highlight"><pre class="highlight"><code>...</code></pre></div></div>
      var codeBlocks = document.querySelectorAll('div.language-mermaid code, pre code.language-mermaid');
      
      codeBlocks.forEach(function(block) {
        // Get the content - need to handle both div.language-mermaid code and pre code.language-mermaid
        var content;
        if (block.parentNode.tagName === 'PRE') {
          content = block.textContent;
        } else if (block.parentNode.classList && block.parentNode.classList.contains('language-mermaid')) {
          // div.language-mermaid > code
          content = block.textContent;
        } else {
          content = block.textContent;
        }
        
        // Create a mermaid div
        var mermaidDiv = document.createElement('div');
        mermaidDiv.className = 'mermaid';
        mermaidDiv.textContent = content;
        
        // Replace the code block with the mermaid div
        if (block.parentNode.tagName === 'PRE') {
          block.parentNode.replaceChild(mermaidDiv, block);
        } else if (block.parentNode.classList && block.parentNode.classList.contains('language-mermaid')) {
          // div.language-mermaid > code - replace the code element
          block.parentNode.replaceChild(mermaidDiv, block);
        } else {
          block.replaceWith(mermaidDiv);
        }
      });
      
      // Initialize Mermaid
      mermaid.initialize({
        startOnLoad: false,
        elementSelector: '.mermaid',
        theme: 'default'
      });
      
      // Render mermaid diagrams
      mermaid.run();
    });
  </script>
</body>
</html>
