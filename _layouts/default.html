<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ page.title | default: site.title | default: 'ICAO MRTD Personalization Complex' }}</title>
  <meta name="theme-color" content="#455a64">
  <style>
    :root {
      color-scheme: light;
      --blue: #455a64;
      --blue-dark: #37474f;
      --blue-soft: #e0f2f1;
      --ink: #263238;
      --text: #37474f;
      --muted: #607d8b;
      --line: #e0e0e0;
      --surface: #ffffff;
      --surface-soft: #fafafa;
      --code: #f1f5fb;
      --shadow: 0 1px 3px rgba(0, 0, 0, .06);
      --radius: 2px;
    }

    * { box-sizing: border-box; }

    html { scroll-behavior: smooth; }

    body {
      margin: 0;
      padding: 0;
      background: var(--surface);
      color: var(--text);
      font: 14px/1.6 Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    .topbar {
      position: sticky; z-index: 20; top: 0; height: 48px;
      display: flex; align-items: center; justify-content: space-between; gap: 20px;
      padding: 0 28px; color: #fff; background: var(--blue);
      box-shadow: 0 2px 5px rgba(0,0,0,.18);
    }
    .brand { display: flex; align-items: center; gap: 10px; color: #fff; font-size: 13px; font-weight: 600; }
    .brand-mark {
      display: grid; place-items: center; width: 32px; height: 32px;
      border: 1px solid rgba(255,255,255,.35); border-radius: 8px;
      font-size: 12px; font-weight: 750;
    }
    .top-links { display: flex; align-items: center; gap: 20px; }
    .top-links a { color: #fff; font-size: 12px; }
    .layout { display: grid; grid-template-columns: 240px minmax(0,1fr); min-height: calc(100vh - 48px); }
    .sidebar {
      position: sticky; top: 48px; align-self: start; height: calc(100vh - 48px);
      overflow-y: auto; padding: 24px 16px 32px 20px;
      border-right: 1px solid var(--line); background: #f5f7f8;
    }
    .side-label {
      margin: 0 0 12px 10px; color: #98a2b3; font-size: 10px;
      font-weight: 750; letter-spacing: .12em; text-transform: uppercase;
    }
    .side-group { margin: 0 0 6px; }
    .side-group summary {
      position: relative; display: block; padding: 7px 26px 7px 10px;
      border-radius: var(--radius); color: #475467; cursor: pointer;
      list-style: none; font-size: 12px; font-weight: 650; line-height: 1.45;
    }
    .side-group summary::-webkit-details-marker { display: none; }
    .side-group summary:after {
      content: ""; position: absolute; right: 12px; top: 10px;
      width: 6px; height: 6px; border-right: 1.5px solid currentColor;
      border-bottom: 1.5px solid currentColor; transform: rotate(45deg);
      transition: transform .15s ease;
    }
    .side-group[open] summary:after { top: 13px; transform: rotate(225deg); }
    .side-group summary:hover { background: #eceff1; color: var(--ink); }
    .side-nav { display: grid; gap: 3px; padding: 3px 0 8px 10px; }
    .side-nav a {
      display: block; padding: 7px 10px; border-radius: var(--radius);
      color: #475467; font-size: 12px; line-height: 1.45;
    }
    .side-nav a:hover { background: #eceff1; color: var(--ink); text-decoration: none; }
    .side-nav .sub-link { padding-left: 20px; color: #667085; font-size: 11px; }
    .side-divider { height: 1px; margin: 20px 4px; background: var(--line); }
    .content {
      width: 100%; max-width: none; min-width: 0;
      padding: 32px 40px 64px; overflow-wrap: anywhere; text-align: left;
    }
    h1, h2, h3, h4, h5, h6 {
      margin-top: 0;
      color: var(--ink);
      line-height: 1.25;
      letter-spacing: -.01em;
    }

    h1 {
      margin: 0 0 12px;
      font-size: clamp(25px, 2.4vw, 30px);
      line-height: 1.25;
      letter-spacing: -.02em;
      font-weight: 400;
    }

    h2 {
      margin: 44px 0 10px;
      padding: 0;
      border: 0;
      font-size: 20px;
      letter-spacing: -.01em;
      font-weight: 400;
    }

    h3 {
      margin: 24px 0 8px;
      font-size: 15px;
      font-weight: 600;
    }

    h4, h5, h6 {
      margin: 20px 0 8px;
      font-size: 14px;
      font-weight: 650;
    }

    p, li {
      color: var(--text);
      font-size: 14px;
      line-height: 1.6;
    }

    p { margin: 0 0 14px; }

    ul, ol {
      margin: 10px 0 18px;
      padding-left: 22px;
    }

    li { margin: 4px 0; }

    a {
      color: var(--blue);
      text-decoration: none;
      text-underline-offset: 3px;
    }

    a:hover {
      color: var(--blue-dark);
      text-decoration: underline;
      text-decoration-color: currentColor;
    }

    a:focus-visible, button:focus-visible {
      outline: 3px solid #8bb8f2;
      outline-offset: 3px;
      border-radius: var(--radius);
    }

    strong { color: var(--ink); }

    hr {
      height: 1px;
      margin: 28px 0;
      border: 0;
      background: var(--line);
    }

    table {
      width: 100%;
      margin: 16px 0 22px;
      border-collapse: collapse;
      background: var(--surface);
      font-size: 12px;
    }

    th, td {
      padding: 10px 12px;
      border: 1px solid var(--line);
      text-align: left;
      vertical-align: top;
    }

    th {
      background: var(--surface-soft);
      color: var(--ink);
      font-size: 11px;
      font-weight: 700;
    }

    td { color: var(--text); }

    blockquote {
      margin: 18px 0;
      padding: 12px 16px;
      border-left: 3px solid var(--blue);
      background: var(--surface-soft);
      color: var(--muted);
    }

    blockquote p:last-child { margin-bottom: 0; }

    code {
      padding: 2px 5px;
      border: 1px solid #e5eaf0;
      border-radius: var(--radius);
      background: var(--code);
      color: var(--blue-dark);
      font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      overflow-wrap: anywhere;
    }

    pre {
      max-width: 100%;
      margin: 16px 0 22px;
      padding: 16px;
      overflow-x: auto;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--code);
      box-shadow: var(--shadow);
      line-height: 1.55;
    }

    pre code {
      padding: 0;
      border: 0;
      background: transparent;
      color: var(--text);
      overflow-wrap: normal;
    }

    .nav-panel {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px 18px;
      margin: 0 0 28px;
      padding: 10px 14px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--surface-soft);
      box-shadow: var(--shadow);
      font-size: 12px;
    }

    .nav-panel a {
      color: var(--blue);
      text-decoration: none;
      font-size: 12px;
      font-weight: 600;
    }

    .nav-panel a:hover {
      color: var(--blue-dark);
      text-decoration: underline;
    }

    .back-to-dashboard {
      display: inline-flex;
      align-items: center;
      min-height: 34px;
      margin: 0 0 14px;
      padding: 7px 11px;
      border: 1px solid var(--blue);
      border-radius: var(--radius);
      background: var(--blue);
      color: #fff;
      font-size: 13px;
      font-weight: 650;
      text-decoration: none;
      transition: background .15s ease, border-color .15s ease;
    }

    .back-to-dashboard:hover {
      border-color: var(--blue-dark);
      background: var(--blue-dark);
      color: #fff;
    }

    .mermaid {
      display: block;
      max-width: 100%;
      margin: 20px auto 26px;
      overflow-x: auto;
      text-align: center;
    }

    .mermaid svg {
      max-width: 100%;
      height: auto;
    }

    @media (max-width: 900px) {
      .content { padding: 28px 24px 56px; }
    }
    @media (max-width: 680px) {
      .topbar { padding: 0 16px; }
      .top-links { gap: 12px; }
      .top-links a { font-size: 11px; }
      .layout { display: block; }
      .sidebar {
        position: static; height: auto; padding: 10px 14px;
        border-right: 0; border-bottom: 1px solid var(--line);
      }
      .side-label, .side-divider { display: none; }
      .side-group { display: inline-block; vertical-align: top; min-width: 180px; }
      .side-group summary { padding: 7px 26px 7px 9px; }
      .side-group .side-nav { padding: 3px 0 8px; }
      .content { padding: 34px 18px 54px; }
      table { display: block; overflow-x: auto; }
      th, td { padding: 9px 10px; }
    }
    @media (max-width: 390px) {
      .brand { font-size: 11px; }
      .brand-mark { width: 28px; height: 28px; }
      .top-links a:first-child { display: none; }
      .side-group { min-width: 145px; }
    }

    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      *, *::before, *::after {
        scroll-behavior: auto !important;
        transition-duration: .01ms !important;
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
      }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="./" aria-label="ICAO MRTD documentation home">
      <span class="brand-mark">MRTD</span>
      <span>ICAO MRTD Documentation</span>
    </a>
    <nav class="top-links" aria-label="Project links">
      <a href="https://github.com/ekatmoz88-alt/icao-mrtd-documentation" target="_blank" rel="noopener noreferrer">GitHub repository ↗</a>
      <a href="https://github.com/ekatmoz88-alt" target="_blank" rel="noopener noreferrer">GitHub profile ↗</a>
    </nav>
  </header>

  <div class="layout">
    <aside class="sidebar" aria-label="Documentation navigation">
      <p class="side-label">Documentation</p>
      <details class="side-group" open>
        <summary>Project</summary>
        <nav class="side-nav" aria-label="Project pages">
          <a href="./">Главная</a>
          <a href="SPECIFICATION.html">Спецификация</a>
          <a href="ARCHITECTURE_DIAGRAMS.html">Архитектурные диаграммы</a>
        </nav>
      </details>
      <div class="side-divider"></div>
      <p class="side-label">On this page</p>
      <details class="side-group" open>
        <summary>Разделы документа</summary>
        <nav class="side-nav" id="page-toc" aria-label="Sections on this page"></nav>
      </details>
    </aside>

    <main class="content">
      {{ content }}
    </main>
  </div>
  
  <!-- Mermaid.js v10 -->
  <script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      var toc = document.getElementById('page-toc');
      var headings = document.querySelectorAll('.content h2, .content h3');
      headings.forEach(function(heading, index) {
        if (!heading.id) {
          heading.id = 'section-' + (index + 1);
        }
        var link = document.createElement('a');
        link.href = '#' + heading.id;
        link.textContent = heading.textContent.trim();
        if (heading.tagName === 'H3') link.className = 'sub-link';
        toc.appendChild(link);
      });
    });
  </script>
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      // Find all code blocks - updated selectors for Jekyll/Rouge wrapping
      // Jekyll wraps: <div class="language-mermaid highlighter-rouge"><div class="highlight"><pre class="highlight"><code>...</code></pre></div></div>
      var codeBlocks = document.querySelectorAll('div.language-mermaid code, pre code.language-mermaid');
      
      codeBlocks.forEach(function(block) {
        // Get the content - need to handle both div.language-mermaid code and pre code.language-mermaid
        var content;
        if (block.parentNode.tagName === 'PRE') {
          content = block.textContent;
        } else if (block.parentNode.classList && block.parentNode.classList.contains('language-mermaid')) {
          // div.language-mermaid > code
          content = block.textContent;
        } else {
          content = block.textContent;
        }
        
        // Create a mermaid div
        var mermaidDiv = document.createElement('div');
        mermaidDiv.className = 'mermaid';
        mermaidDiv.textContent = content;
        
        // Replace the code block with the mermaid div
        if (block.parentNode.tagName === 'PRE') {
          block.parentNode.replaceChild(mermaidDiv, block);
        } else if (block.parentNode.classList && block.parentNode.classList.contains('language-mermaid')) {
          // div.language-mermaid > code - replace the code element
          block.parentNode.replaceChild(mermaidDiv, block);
        } else {
          block.replaceWith(mermaidDiv);
        }
      });
      
      // Initialize Mermaid
      mermaid.initialize({
        startOnLoad: false,
        elementSelector: '.mermaid',
        theme: 'default'
      });
      
      // Render mermaid diagrams
      mermaid.run();
    });
  </script>
</body>
</html>
